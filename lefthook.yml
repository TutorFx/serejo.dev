pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: '*.{js,cjs,mjs,jsx,ts,cts,mts,tsx}'
      run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.vue'
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,vue}'
      run: bun run typecheck
