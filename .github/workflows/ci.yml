name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1 # Substitui pnpm/action-setup e actions/setup-node
        with:
          bun-version: 1.2.15

      - name: Install
        run: bun install # Substitui pnpm install

      - name: Lint
        run: bun run lint # Substitui pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.15

      - name: Install
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.15
      # Vitest runs on Node (node shebang in its bin) and requires Node ^22.12 || ^24
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install

      # Unit tests of the agent security layers (history merge, approvals, meeting policy, output sanitization)
      - name: Test
        run: bun run test
